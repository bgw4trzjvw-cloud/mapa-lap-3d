<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LAP 3D • São Paulo</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#101018;color:white;font:15px system-ui}#map{position:absolute;inset:0}.top{position:absolute;z-index:2;top:env(safe-area-inset-top);left:12px;right:12px;padding:12px;background:#171622eF;border-radius:18px;box-shadow:0 5px 30px #0008}.brand{font-weight:800;letter-spacing:1px;margin-bottom:10px}.brand b{color:#a56aff}.brand em{color:#ff8c39;font-style:normal}form{display:flex;gap:7px}input{min-width:0;flex:1;background:#282536;color:white;border:1px solid #555;border-radius:9px;padding:12px}button{background:#884ee5;color:white;border:0;border-radius:10px;padding:11px;font-weight:700}.bottom{position:absolute;z-index:2;bottom:calc(18px + env(safe-area-inset-bottom));left:12px;right:12px;background:#171622ed;border-radius:16px;padding:12px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{flex:1}#status{font-size:13px;color:#ddd;margin-top:9px}select{background:#282536;color:white;border:1px solid #555;border-radius:8px;padding:9px;width:100%;margin-bottom:9px}</style></head><body><div id="map"></div><div class="top"><div class="brand">URBANON <b>◆</b> <em>LAP 3D</em></div><form id="search"><input id="q" placeholder="Buscar endereço em São Paulo" aria-label="Buscar endereço"><button>Buscar</button></form></div><div class="bottom"><select id="places"><option value="">Pontos turísticos de São Paulo</option><option value="-46.6559,-23.5614">MASP • Avenida Paulista</option><option value="-46.6333,-23.5504">Catedral da Sé</option><option value="-46.6388,-23.5453">Theatro Municipal</option><option value="-46.6576,-23.5874">Parque Ibirapuera</option><option value="-46.6506,-23.5618">Japan House</option><option value="-46.6341,-23.5433">Mercado Municipal</option><option value="-46.6477,-23.5489">Edifício Copan</option><option value="-46.6317,-23.5451">Farol Santander</option></select><div class="controls"><button id="mode">Visão 2D</button><button id="loc">Minha localização</button><button id="route">Traçar rota</button></div><div id="status">Carregando mapa de São Paulo…</div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>const status=document.querySelector('#status');let destination=null,origin=null,three=true;const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-46.6506,-23.5614],zoom:15.4,pitch:65,bearing:-20,antialias:true});map.addControl(new maplibregl.NavigationControl(),'bottom-right');map.on('load',()=>{try{const layers=map.getStyle().layers;const label=layers.find(x=>x.type==='symbol'&&x.layout&&x.layout['text-field']);map.addLayer({id:'lap-buildings-3d',type:'fill-extrusion',source:'openmaptiles', 'source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],['get','height'],10],0,'#373246',100,'#74628f',250,'#a08dbd'],'fill-extrusion-height':['coalesce',['to-number',['get','render_height']],['to-number',['get','height']],12],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],0],'fill-extrusion-opacity':0.85}},label?.id)}catch(e){console.warn(e)}status.textContent='Mapa pronto. Selecione um ponto turístico ou busque um endereço.'});map.on('error',e=>{console.warn(e.error);if(!map.loaded())status.textContent='Erro ao carregar dados do mapa. Confira a conexão.'});function target(c,name){destination=c;map.flyTo({center:c,zoom:17,pitch:three?65:0,essential:true});new maplibregl.Marker({color:'#ff873e'}).setLngLat(c).setPopup(new maplibregl.Popup().setText(name)).addTo(map);status.textContent='Destino: '+name}document.querySelector('#places').onchange=e=>{if(!e.target.value)return;target(e.target.value.split(',').map(Number),e.target.selectedOptions[0].text)};document.querySelector('#search').onsubmit=async e=>{e.preventDefault();let q=document.querySelector('#q').value.trim();if(!q)return;status.textContent='Buscando…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q+', São Paulo, SP'));let d=await r.json();if(!d.length)throw Error('Endereço não encontrado');target([+d[0].lon,+d[0].lat],d[0].display_name)}catch(e){status.textContent=e.message}};document.querySelector('#mode').onclick=()=>{three=!three;map.easeTo({pitch:three?65:0,bearing:three?-20:0,duration:900});if(map.getLayer('lap-buildings-3d'))map.setLayoutProperty('lap-buildings-3d','visibility',three?'visible':'none');document.querySelector('#mode').textContent=three?'Visão 2D':'Visão 3D'};document.querySelector('#loc').onclick=()=>{if(!navigator.geolocation){status.textContent='GPS indisponível';return}status.textContent='Obtendo localização…';navigator.geolocation.getCurrentPosition(p=>{origin=[p.coords.longitude,p.coords.latitude];map.flyTo({center:origin,zoom:16});new maplibregl.Marker({color:'#8d58ef'}).setLngLat(origin).addTo(map);status.textContent='Localização obtida'},e=>status.textContent='GPS: '+e.message,{enableHighAccuracy:true,timeout:12000})};document.querySelector('#route').onclick=async()=>{if(!destination){status.textContent='Escolha primeiro um destino';return}if(!origin){status.textContent='Toque em Minha localização e autorize o GPS';return}status.textContent='Calculando rota…';try{const p=origin.join(',')+';'+destination.join(',');const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+p+'?overview=full&geometries=geojson');const d=await r.json();if(!d.routes?.length)throw Error('Rota indisponível');if(map.getLayer('lap-route'))map.removeLayer('lap-route');if(map.getSource('lap-route'))map.removeSource('lap-route');map.addSource('lap-route',{type:'geojson',data:{type:'Feature',geometry:d.routes[0].geometry,properties:{}}});map.addLayer({id:'lap-route',type:'line',source:'lap-route',paint:{'line-color':'#a35cff','line-width':7,'line-opacity':.95}});const b=new maplibregl.LngLatBounds();d.routes[0].geometry.coordinates.forEach(c=>b.extend(c));map.fitBounds(b,{padding:85,pitch:three?50:0});status.textContent=(d.routes[0].distance/1000).toFixed(1)+' km • '+Math.round(d.routes[0].duration/60)+' min estimados (sem trânsito em tempo real)'}catch(e){status.textContent='Falha ao calcular rota: '+e.message}};</script></body></html>
