<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LAP 3D • São Paulo</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#101018;color:white;font:15px system-ui}#map{position:absolute;inset:0}.top{position:absolute;z-index:2;top:env(safe-area-inset-top);left:12px;right:12px;padding:12px;background:#171622eF;border-radius:18px;box-shadow:0 5px 30px #0008}.brand{font-weight:800;letter-spacing:1px;margin-bottom:10px}.brand b{color:#a56aff}.brand em{color:#ff8c39;font-style:normal}form{display:flex;gap:7px}input{min-width:0;flex:1;background:#282536;color:white;border:1px solid #555;border-radius:16px;padding:12px}button{background:#884ee5;color:white;border:0;border-radius:16px;padding:11px;font-weight:700}.bottom{position:absolute;z-index:2;bottom:calc(18px + env(safe-area-inset-bottom));left:12px;right:12px;background:#171622ed;border-radius:24px;padding:12px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{flex:1}.theme-picker{display:flex;align-items:center;gap:8px;margin:0 0 10px}.theme-picker label{font-size:13px;white-space:nowrap;color:#ddd}.theme-picker select{margin:0;flex:1}.theme-hint{font-size:12px;color:#cfc6e1;margin-bottom:8px}#status{font-size:13px;color:#ddd;margin-top:9px}select{background:#282536;color:white;border:1px solid #555;border-radius:14px;padding:9px;width:100%;margin-bottom:9px}</style></head><body><div id="map"></div><div class="top"><div class="brand">URBANON <b>◆</b> <em>LAP 3D</em></div><form id="search"><input id="q" placeholder="Buscar endereço em São Paulo" aria-label="Buscar endereço"><button>Buscar</button></form></div><div class="bottom"><div class="theme-picker"><label for="theme">Tema do mapa</label><select id="theme"><option value="auto">Automático · dia/noite</option><option value="day">Dia · laranja</option><option value="night">Noite · roxo</option></select></div><div class="theme-hint" id="theme-hint">Tema automático conforme a luz solar</div><select id="places"><option value="">Pontos turísticos de São Paulo</option><option value="-46.6559,-23.5614">MASP • Avenida Paulista</option><option value="-46.6333,-23.5504">Catedral da Sé</option><option value="-46.6388,-23.5453">Theatro Municipal</option><option value="-46.6576,-23.5874">Parque Ibirapuera</option><option value="-46.6506,-23.5618">Japan House</option><option value="-46.6341,-23.5433">Mercado Municipal</option><option value="-46.6477,-23.5489">Edifício Copan</option><option value="-46.6317,-23.5451">Farol Santander</option></select><div class="controls"><button id="mode">Visão 2D</button><button id="loc" type="button">Iniciar GPS</button><button id="route">Traçar rota</button></div><div id="status">Carregando mapa de São Paulo…</div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>const status=document.querySelector('#status');let destination=null,origin=null,three=true;const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-46.6506,-23.5614],zoom:15.4,pitch:65,bearing:-20,antialias:true});map.addControl(new maplibregl.NavigationControl(),'bottom-right');const themeSelect=document.querySelector('#theme'),themeHint=document.querySelector('#theme-hint');let themePreference='auto',activeTheme=null,solarCoords=[-46.6506,-23.5614];try{themePreference=localStorage.getItem('lap-theme')||'auto'}catch(e){}if(!['auto','day','night'].includes(themePreference))themePreference='auto';themeSelect.value=themePreference;
function sunAboveHorizon(date,coords){const rad=Math.PI/180,days=date.getTime()/86400000+2440587.5-2451545.0;const M=(357.5291+0.98560028*days)*rad;const C=(1.9148*Math.sin(M)+0.0200*Math.sin(2*M)+0.0003*Math.sin(3*M))*rad;const lambda=M+C+102.9372*rad+Math.PI;const dec=Math.asin(Math.sin(lambda)*Math.sin(23.4397*rad));const ra=Math.atan2(Math.sin(lambda)*Math.cos(23.4397*rad),Math.cos(lambda));const sid=(280.16+360.9856235*days+coords[0])*rad;const hourAngle=sid-ra;const altitude=Math.asin(Math.sin(coords[1]*rad)*Math.sin(dec)+Math.cos(coords[1]*rad)*Math.cos(dec)*Math.cos(hourAngle));return altitude>-0.833*rad}
function applyTheme(){if(!map.getStyle()?.layers)return;const mode=themePreference==='auto'?(sunAboveHorizon(new Date(),solarCoords)?'day':'night'):themePreference;const day=mode==='day';const p=day?{ground:'#8d3b14',building:'#ffdaa8',water:'#73300f',label:'#fff5e8'}:{ground:'#211235',building:'#b69ce5',water:'#1a102d',label:'#f1e9ff'};if(activeTheme!==mode){let changed=0;for(const layer of map.getStyle().layers){const id=layer.id.toLowerCase();const sourceLayer=(layer['source-layer']||'').toLowerCase();const road=/road|street|highway|transport|bridge|tunnel|motorway|trunk|primary|secondary|tertiary|residential|service|path|pedestrian|footway|cycleway/.test(id+' '+sourceLayer);try{if(layer.type==='background'){map.setPaintProperty(layer.id,'background-color',p.ground);changed++}else if(layer.type==='fill'){map.setPaintProperty(layer.id,'fill-color',road?'#ffffff':/water/.test(id+' '+sourceLayer)?p.water:p.ground);map.setPaintProperty(layer.id,'fill-pattern',null);changed++}else if(layer.type==='line'){map.setPaintProperty(layer.id,'line-color',road?'#ffffff':p.ground);map.setPaintProperty(layer.id,'line-pattern',null);map.setPaintProperty(layer.id,'line-opacity',road?1:0.45);if(road){map.setLayoutProperty(layer.id,'line-cap','round');map.setLayoutProperty(layer.id,'line-join','round');if(/road|street|highway|motorway|primary|secondary|tertiary|residential/.test(id+' '+sourceLayer)){map.setPaintProperty(layer.id,'line-blur',0.35)}}changed++}else if(layer.type==='fill-extrusion'){map.setPaintProperty(layer.id,'fill-extrusion-color',p.building);changed++}else if(layer.type==='symbol'){if(layer.paint&&Object.prototype.hasOwnProperty.call(layer.paint,'text-color'))map.setPaintProperty(layer.id,'text-color',p.label);if(layer.paint&&Object.prototype.hasOwnProperty.call(layer.paint,'text-halo-color'))map.setPaintProperty(layer.id,'text-halo-color',p.ground)}}catch(err){console.warn('LAP theme layer',id,err)}}activeTheme=mode;console.info('LAP theme',mode,changed,'layers')}themeHint.textContent=themePreference==='auto'?'Automático: '+(day?'dia (laranja)':'noite (roxo)')+' · conforme a posição do sol':day?'Modo dia: chão laranja escuro e prédios claros':'Modo noite: chão roxo escuro e prédios claros'}
themeSelect.addEventListener('change',()=>{themePreference=themeSelect.value;activeTheme=null;try{localStorage.setItem('lap-theme',themePreference)}catch(e){}applyTheme()});setInterval(()=>{if(themePreference==='auto')applyTheme()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyTheme()});
map.on('load',()=>{try{const layers=map.getStyle().layers;const label=layers.find(x=>x.type==='symbol'&&x.layout&&x.layout['text-field']);map.addLayer({id:'lap-buildings-3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':'#b69ce5','fill-extrusion-height':['coalesce',['to-number',['get','render_height']],['to-number',['get','height']],12],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],0],'fill-extrusion-opacity':0.76}},label?.id);setTimeout(applyTheme,500)}catch(e){console.warn(e)}status.textContent='Mapa pronto. Selecione um ponto turístico ou busque um endereço.'});
map.on('error',e=>{console.warn(e.error);if(!map.loaded())status.textContent='Erro ao carregar dados do mapa. Confira a conexão.'});function target(c,name){destination=c;map.flyTo({center:c,zoom:17,pitch:three?65:0,essential:true});new maplibregl.Marker({color:'#ff873e'}).setLngLat(c).setPopup(new maplibregl.Popup().setText(name)).addTo(map);status.textContent='Destino: '+name}document.querySelector('#places').onchange=e=>{if(!e.target.value)return;target(e.target.value.split(',').map(Number),e.target.selectedOptions[0].text)};document.querySelector('#search').onsubmit=async e=>{e.preventDefault();let q=document.querySelector('#q').value.trim();if(!q)return;status.textContent='Buscando…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q+', São Paulo, SP'));let d=await r.json();if(!d.length)throw Error('Endereço não encontrado');target([+d[0].lon,+d[0].lat],d[0].display_name)}catch(e){status.textContent=e.message}};document.querySelector('#mode').onclick=()=>{three=!three;map.easeTo({pitch:three?65:0,bearing:three?-20:0,duration:900});if(map.getLayer('lap-buildings-3d'))map.setLayoutProperty('lap-buildings-3d','visibility',three?'visible':'none');document.querySelector('#mode').textContent=three?'Visão 2D':'Visão 3D'};let gpsWatch=null,gpsMarker=null,lastGpsTime=0,lastHeading=null;const gpsButton=document.querySelector('#loc');function stopGps(){if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;gpsButton.textContent='Iniciar GPS';status.textContent='Acompanhamento GPS pausado'}function onGpsPosition(p){const {latitude,longitude,accuracy,heading,speed}=p.coords;if(!Number.isFinite(latitude)||!Number.isFinite(longitude))return;origin=[longitude,latitude];solarCoords=origin;if(!gpsMarker){gpsMarker=new maplibregl.Marker({color:'#8d58ef'}).setLngLat(origin).addTo(map)}else gpsMarker.setLngLat(origin);if(themePreference==='auto')applyTheme();const now=Date.now();if(now-lastGpsTime>850){const opts={center:origin,zoom:Math.max(map.getZoom(),16),duration:lastGpsTime?750:1200,essential:true};if(three){opts.pitch=65;if(Number.isFinite(heading)&&heading>=0&&(speed===null||speed>1.5)){lastHeading=heading}if(lastHeading!==null)opts.bearing=lastHeading}map.easeTo(opts);lastGpsTime=now}const kmh=Number.isFinite(speed)&&speed>=0?Math.round(speed*3.6):null;status.textContent='GPS acompanhando · precisão ±'+Math.round(accuracy)+' m'+(kmh===null?'':' · '+kmh+' km/h')}gpsButton.onclick=()=>{if(gpsWatch!==null){stopGps();return}if(!navigator.geolocation){status.textContent='GPS indisponível neste navegador';return}status.textContent='Solicitando permissão de localização…';gpsButton.textContent='Parar GPS';gpsWatch=navigator.geolocation.watchPosition(onGpsPosition,e=>{status.textContent='GPS: '+e.message;if(e.code===1)stopGps()},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})};document.addEventListener('visibilitychange',()=>{if(document.hidden&&gpsWatch!==null){status.textContent='Mantenha o LAP aberto para acompanhamento contínuo'}});document.querySelector('#route').onclick=async()=>{if(!destination){status.textContent='Escolha primeiro um destino';return}if(!origin){status.textContent='Toque em Minha localização e autorize o GPS';return}status.textContent='Calculando rota…';try{const p=origin.join(',')+';'+destination.join(',');const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+p+'?overview=full&geometries=geojson');const d=await r.json();if(!d.routes?.length)throw Error('Rota indisponível');if(map.getLayer('lap-route'))map.removeLayer('lap-route');if(map.getSource('lap-route'))map.removeSource('lap-route');map.addSource('lap-route',{type:'geojson',data:{type:'Feature',geometry:d.routes[0].geometry,properties:{}}});map.addLayer({id:'lap-route',type:'line',source:'lap-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#a35cff','line-width':7,'line-opacity':.95,'line-blur':0.5}});const b=new maplibregl.LngLatBounds();d.routes[0].geometry.coordinates.forEach(c=>b.extend(c));map.fitBounds(b,{padding:85,pitch:three?50:0});status.textContent=(d.routes[0].distance/1000).toFixed(1)+' km • '+Math.round(d.routes[0].duration/60)+' min estimados (sem trânsito em tempo real)'}catch(e){status.textContent='Falha ao calcular rota: '+e.message}};</script></body></html>
